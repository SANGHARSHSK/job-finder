{% extends "base.html" %}

{% block title %}{% if object %}Edit job{% else %}Post a job{% endif %} · Job Finder{% endblock %}

{% block content %}
  <h1>{% if object %}Edit job{% else %}Post a job{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary">Save job</button>
    <a href="{% url 'jobs:employer_job_list' %}">Cancel</a>
  </form>
{% endblock %}
