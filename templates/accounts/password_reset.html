{% extends "base.html" %}

{% block title %}Change password · Job Finder{% endblock %}

{% block content %}
  <h1>Change password</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary">Change password</button>
  </form>
  <p class="mt-3"><a href="{% url 'accounts:profile' %}">Cancel</a></p>
{% endblock %}
