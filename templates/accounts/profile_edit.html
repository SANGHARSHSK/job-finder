{% extends "base.html" %}

{% block title %}Edit profile · Job Finder{% endblock %}

{% block content %}
  <h1>Edit profile</h1>
  <form method="post">
    {% csrf_token %}
    <fieldset class="mb-3">
      <legend>Account</legend>
      {{ user_form }}
    </fieldset>
    <fieldset class="mb-3">
      <legend>Profile</legend>
      {{ profile_form }}
    </fieldset>
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
{% endblock %}
