{% extends "base.html" %}

{% block title %}Register · Job Finder{% endblock %}

{% block content %}
  <h1>Create your account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p class="mt-3">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
{% endblock %}
