{% extends "base.html" %}

{% block title %}Log in · Job Finder{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="mt-3">New here? <a href="{% url 'accounts:register' %}">Create an account</a>.</p>
{% endblock %}
